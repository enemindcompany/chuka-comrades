
name: Build Chuka Comrades

on:
  push:
    branches:
      - secure-firebase-api-foundation
  pull_request:
    branches:
      - secure-firebase-api-foundation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
